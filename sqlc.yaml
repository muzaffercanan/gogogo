# sqlc configuration. Regenerate with `make generate` (sqlc runs in Docker because it needs cgo).
# The schema is read from the golang-migrate files; sqlc skips the *.down.sql files.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
