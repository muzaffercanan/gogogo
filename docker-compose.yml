name: gogogo

x-app: &app
  image: gogogo:local
  build: .
  restart: unless-stopped
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
    AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.20.1
    command: ["-path=/migrations", "-database=postgres://notify:notify@postgres:5432/notify?sslmode=disable", "up"]
    volumes: ["./migrations:/migrations:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  mock-provider:
    <<: *app
    command: ["/app/mockprovider"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      MOCK_LATENCY: ${MOCK_LATENCY:-50ms}
      MOCK_JITTER: ${MOCK_JITTER:-50ms}
      MOCK_REJECT_RATE: ${MOCK_REJECT_RATE:-0}
      MOCK_THROTTLE_RATE: ${MOCK_THROTTLE_RATE:-0}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
    ports: ["9090:8080"]

  api:
    <<: *app
    command: ["/app/api"]
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  relay:
    <<: *app
    command: ["/app/relay"]
    ports: ["8081:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *app-env
      PROVIDER_URL: ${PROVIDER_URL:-http://mock-provider:8080/send}
    ports: ["8082:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-provider: { condition: service_started }

volumes:
  pgdata:
