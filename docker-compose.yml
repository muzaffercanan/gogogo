name: gogogo

x-app: &app
  image: gogogo:local
  build: .
  restart: unless-stopped
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
    AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    REDIS_URL: redis://redis:6379/0
    # Spans go to Jaeger over OTLP/HTTP. Set it to an empty value in .env to turn tracing off.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      # `ping` passes before the AMQP listener accepts connections; check the ports instead.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    # The bundled configuration with in-memory storage, bounded to the latest 20 000 traces (about
    # 12 KB each, so about 240 MB).
    command: ["--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=20000"]
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    # The image declares /prometheus a volume; tmpfs keeps the metrics with the container instead. It is
    # owned by nobody, the user Prometheus runs as.
    tmpfs: ["/prometheus:uid=65534,gid=65534"]
    # 9090 on the host is the mock provider's.
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      # Anonymous admin without a login form: for a local stack only, so the port is bound to localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notifications.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  migrate:
    image: migrate/migrate:v4.20.1
    command: ["-path=/migrations", "-database=postgres://notify:notify@postgres:5432/notify?sslmode=disable", "up"]
    volumes: ["./migrations:/migrations:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  mock-provider:
    <<: *app
    command: ["/app/mockprovider"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      MOCK_LATENCY: ${MOCK_LATENCY:-50ms}
      MOCK_JITTER: ${MOCK_JITTER:-50ms}
      MOCK_REJECT_RATE: ${MOCK_REJECT_RATE:-0}
      MOCK_THROTTLE_RATE: ${MOCK_THROTTLE_RATE:-0}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-1s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    ports: ["9090:8080"]

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      <<: *app-env
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  relay:
    <<: *app
    command: ["/app/relay"]
    ports: ["8081:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *app
    command: ["/app/worker"]
    # Sends in flight finish before the worker exits: up to PROVIDER_TIMEOUT, then the outcome write.
    stop_grace_period: 30s
    environment:
      <<: *app-env
      PROVIDER_URL: ${PROVIDER_URL:-http://mock-provider:8080/send}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-10s}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-20}
      PRIORITY_WEIGHT_HIGH: ${PRIORITY_WEIGHT_HIGH:-6}
      PRIORITY_WEIGHT_NORMAL: ${PRIORITY_WEIGHT_NORMAL:-3}
      PRIORITY_WEIGHT_LOW: ${PRIORITY_WEIGHT_LOW:-1}
    ports: ["8082:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-provider: { condition: service_started }

  # Load test, started only by `make load` (docker compose run --rm k6). Tune it with -e, for example
  # BATCHES, BATCH_SIZE or DRAIN_TIMEOUT_SECONDS.
  k6:
    image: grafana/k6:2.4.0
    profiles: [load]
    command: ["run", "--log-format=raw", "/scripts/burst.js"]
    environment:
      API_URL: http://api:8080
    volumes: ["./test/load:/scripts:ro"]
    depends_on: [api]

volumes:
  pgdata:
